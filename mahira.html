<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mahira</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f5f5f5;
      color: #222;
    }

    header {
      background: #222;
      color: white;
      text-align: center;
      padding: 25px 10px;
    }

    .container {
      max-width: 800px;
      margin: 20px auto;
      padding: 20px;
    }

    .post {
      background: white;
      padding: 20px;
      margin-bottom: 20px;
      border-radius: 10px;
      box-shadow: 0 2px 8px #ccc;
    }

    h1 {
      margin: 0;
    }

    h2 {
      margin-top: 0;
    }

    .date {
      color: #777;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <header>
    <h1>MAHIRA</h1>
    <p>আমাদের গল্প ও লেখা</p>
  </header>

  <div class="container">

    <div class="post">
      <h2>আমার প্রথম পোস্ট</h2>
      <p class="date">৫ অক্টোবর ২০২৬</p>

      <p>
        এখানে আপনার নিজের লেখা পোস্ট লিখবেন।
        আপনি চাইলে গল্প, কবিতা, অনুভূতি বা যেকোনো লেখা প্রকাশ করতে পারবেন।
      </p>
    </div>

  </div>

</body>
</html>
